; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two camera boards share one firmware. `pio run` builds both; pick one with
;   pio run -e esp32cam     -t upload     (AI Thinker ESP32-CAM, OV2640/OV5640)
;   pio run -e freenove_s3  -t upload     (Freenove ESP32-S3 WROOM CAM, N8R8)
; Pin maps live in include/board_pins.h.

[env]
platform = espressif32@6.6.0
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
lib_deps =
    bblanchon/ArduinoJson
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32cam]
board = esp32cam
build_flags =
    -DBIRDCAM_BOARD_AI_THINKER
upload_port = COM8
monitor_port = COM8
monitor_rts = 0
monitor_dtr = 0

; Freenove ESP32-S3 WROOM CAM: ESP32-S3-WROOM-1 N8R8 (8 MB quad flash,
; 8 MB octal PSRAM). platform 6.6.0 has no Freenove board file, so this is the
; generic DevKitC-1 definition with the module's real memory configured.
; Plug into the USB-C port labelled UART/COM (CH343 bridge), not the native
; USB port, so Serial and auto-reset work like the ESP32-CAM-MB.
; No upload_port: the CH343 gets its own COM number; set one here once known.
[env:freenove_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    -DBIRDCAM_BOARD_FREENOVE_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
; Release DTR/RTS so opening the monitor doesn't hold the S3 in reset/boot.
monitor_rts = 0
monitor_dtr = 0

; Same as freenove_s3 with the core's verbose boot log, for bring-up debugging:
;   pio run -e freenove_s3_debug -t upload --upload-port COMx
[env:freenove_s3_debug]
extends = env:freenove_s3
build_type = debug
build_flags =
    ${env:freenove_s3.build_flags}
    -DCORE_DEBUG_LEVEL=5
